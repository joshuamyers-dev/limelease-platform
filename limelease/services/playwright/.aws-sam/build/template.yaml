AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Resources:
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
          Action: sts:AssumeRole
      Policies:
      - PolicyName: LambdaSecretsManagerPolicy
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action: secretsmanager:GetSecretValue
            Resource:
              Fn::Sub: arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:MyLambdaSecretKey-*
  ScrapeApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: ScrapeApi
      StageName: prod
      Cors:
        AllowMethods: '''POST,OPTIONS'''
        AllowHeaders: '''Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token,X-Amz-User-Agent'''
        AllowOrigin: '''*'''
    ScrapeFunction:
      Type: AWS::Serverless::Function
      Properties:
        Handler: index.handler
        Runtime: nodejs18.x
        CodeUri: .
        MemorySize: 1024
        Timeout: 200
        ReservedConcurrentExecutions: 100
        Role:
          Fn::GetAtt:
          - LambdaExecutionRole
          - Arn
        Events:
          ScrapeEvent:
            Type: Api
            Properties:
              Path: /scrape
              Method: post
              RestApiId:
                Ref: ScrapeApi
Outputs:
  ApiEndpointUrl:
    Description: URL of the API endpoint
    Value:
      Fn::Sub: https://${ScrapeApi}.execute-api.${AWS::Region}.amazonaws.com/prod/scrape
