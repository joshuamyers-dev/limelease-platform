mutation createProperty(
  $propertyDetails: PropertyDetails!
  $leaseDetails: LeaseDetails
  $files: [CreateFile]
  $photos: [CreatePhoto!]
  $tenants: [TenantObject!]
  $landlords: [Landlord!]!
) {
  createProperty(propertyDetails: $propertyDetails, leaseDetails: $leaseDetails, files: $files, photos: $photos, tenants: $tenants, landlords: $landlords) {
    ...PropertyBase
  }
}
